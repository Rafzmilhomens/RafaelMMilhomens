{{ define "main" }}

<section class="frontispiece">
  <img class="selo" src="{{ "hanko.svg" | relURL }}" alt="Selo de Rafael M. Milhomens" width="180" height="180">
  <div class="content">
    {{ .Content }}
  </div>
</section>

{{ with .Site.GetPage "/portfolio" }}
<ul class="toc">
  {{ range .Pages.ByWeight }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.summary }}<span class="project-desc">{{ . }}</span>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}

{{ end }}
