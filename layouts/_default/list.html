{{ define "main" }}

<h1>{{ .Title }}</h1>

<div class="content">
  {{ .Content }}
</div>

{{ if eq .Section "portfolio" }}
<ul class="toc">
  {{ range .Pages.ByWeight }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.summary }}<span class="project-desc">{{ . }}</span>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}

{{ end }}
