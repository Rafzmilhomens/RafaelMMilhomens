<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" type="image/svg+xml" href="{{ "hanko.svg" | relURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>

  <header class="site-header">
    <a href="{{ .Site.BaseURL }}" class="site-title">{{ .Site.Params.author }}</a>
    <nav class="site-nav">
      <a href="{{ "sobre/" | relURL }}"{{ if eq .Section "sobre" }} class="active"{{ end }}>Sobre</a>
      <a href="{{ .Site.BaseURL }}"{{ if or .IsHome (eq .Section "portfolio") }} class="active"{{ end }}>Portfólio</a>
      <a href="{{ "contato/" | relURL }}"{{ if eq .Section "contato" }} class="active"{{ end }}>Contato</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <img class="selo-mini" src="{{ "hanko.svg" | relURL }}" alt="Selo Milhomens" width="22" height="22">
    {{ .Site.Params.author }} · {{ now.Year }}
  </footer>

</body>
</html>
