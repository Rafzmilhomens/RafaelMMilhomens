{{ define "main" }}

<article>
  <h1>{{ .Title }}</h1>

  {{ with .Params.summary }}
  <p class="project-meta">{{ . }}</p>
  {{ end }}

  <div class="content">
    {{ .Content }}
  </div>

  {{ with .Params.links }}
  <hr>
  <div class="project-links">
    {{ range $i, $l := . }}{{ if $i }} · {{ end }}<a href="{{ $l.url }}" target="_blank" rel="noopener">{{ $l.titulo }}</a>{{ end }}
  </div>
  {{ end }}

  {{ if eq .Section "portfolio" }}
  <a class="back" href="{{ "portfolio/" | relURL }}">← Portfólio</a>
  {{ end }}
</article>

{{ end }}
